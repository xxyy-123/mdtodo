[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mdtodo"
version = "0.2.0"
description = "Collect TODO comments and task list items from Markdown files"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "xxyy-123" }]
keywords = ["markdown", "todo", "cli", "notes"]
classifiers = [
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Documentation",
    "Topic :: Utilities",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
mdtodo = "mdtodo.cli:main"

[project.urls]
Homepage = "https://github.com/xxyy-123/mdtodo"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mdtodo = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
